<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Смена цвета квадрата</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column; /* элементы идут сверху вниз */
      align-items: center;
      gap: 20px;
      margin-top: 50px;
    }

    #square {
      width: 150px;
      height: 150px;
      background-color: blue;
      transition: 0.3s;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="square"></div>

  <button id="changeBtn">Сменить цвет</button>

  <script>
    const square = document.getElementById("square");
    const button = document.getElementById("changeBtn");

    button.addEventListener("click", () => {
      square.style.backgroundColor = "red";
    });
  </script>

</body>
</html>
